[package]
name = "aemeath"
version = "1.0.0"
edition = "2024"

[dependencies]
poise = { git = "https://github.com/serenity-rs/poise.git", branch = "serenity-next" }
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", features = ["blocking", "json", "gzip", "multipart", "stream", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["ring"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

dotenvy = "0.15"
rand = "0.10"

[profile.release]
strip = true      # Automatically strip symbols from the binary.
lto = true        # Link-time optimization.
opt-level = 3     # Optimize for speed.
codegen-units = 1 # Maximum size reduction optimizations.